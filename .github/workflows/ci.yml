name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra ml
      - run: uv pip check
      - run: uv run --frozen --extra dev --extra ml ruff check src tests paper/software-impacts/build_manuscript.py
      - run: uv run --frozen --extra dev --extra ml python -m compileall -q src tests paper/software-impacts/build_manuscript.py
      - run: uv run --frozen --extra dev --extra ml python -m unittest discover -s tests -v
      - run: uv run --frozen --extra dev --extra ml python -m build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra ml
      - run: uv run --frozen --extra dev --extra ml python -m unittest discover -s tests -v
      - run: uv run --frozen --extra dev --extra ml cpo-stcm demo

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cpo-stcm:test .
      - run: docker run --rm cpo-stcm:test demo
